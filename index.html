<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>talk3r</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #2b2d31; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#1e1f22] text-gray-200 h-screen w-screen overflow-hidden flex font-sans select-none">

  <!-- 1. REL SERVER (Kiri) -->
  <div class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 shrink-0 z-20">
    <button onclick="showHub()" title="Discovery Hub" class="w-12 h-12 bg-green-500 text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition cursor-pointer">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
    </button>
    <div class="w-8 h-[2px] bg-[#35363c] rounded"></div>
    <div id="server-rail" class="flex flex-col space-y-2 items-center w-full overflow-y-auto max-h-[calc(100vh-220px)]"></div>
    <!-- Tombol Buat Server -->
    <button onclick="openModal('modal-server')" title="Buat Grup" class="w-12 h-12 bg-[#313338] text-green-500 hover:bg-green-500 hover:text-white rounded-3xl hover:rounded-2xl flex items-center justify-center active:scale-90 transition cursor-pointer">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
    <!-- Tombol Join Kode -->
    <button onclick="openModal('modal-join')" title="Gabung Kode" class="w-12 h-12 bg-[#313338] text-indigo-400 hover:bg-indigo-500 hover:text-white rounded-3xl hover:rounded-2xl flex items-center justify-center active:scale-90 transition cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
    </button>
  </div>

  <!-- 2. SIDEBAR CHANNEL -->
  <div id="sidebar" class="w-60 bg-[#2b2d31] flex flex-col border-r border-[#1f2023] shrink-0 hidden">
    <div class="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 font-bold text-white shadow-sm">
      <span id="server-title" class="truncate text-sm">talk3r</span>
      <button onclick="showInvite()" title="Kode Undangan" class="text-gray-400 hover:text-white p-1 rounded hover:bg-[#35373c] active:scale-90 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
      </button>
    </div>
    <div class="flex-1 p-2 space-y-1 overflow-y-auto">
      <div class="flex items-center justify-between px-2 pt-2 pb-1">
        <span class="text-[11px] font-bold text-gray-400">CHANNELS</span>
        <button onclick="openModal('modal-channel')" title="Tambah Channel" class="text-gray-400 hover:text-white cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
      <div id="channel-list" class="space-y-0.5"></div>
    </div>
    <!-- Footer User -->
    <div class="h-14 bg-[#232428] flex items-center px-3 justify-between">
      <div onclick="openModal('modal-profile')" class="flex items-center space-x-2 cursor-pointer flex-1 truncate">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0" id="user-avatar">U</div>
        <span class="text-xs font-semibold text-white truncate" id="user-name">User</span>
      </div>
      <button onclick="leaveServer()" class="text-xs text-red-400 hover:text-red-300 cursor-pointer ml-2">Keluar</button>
    </div>
  </div>

  <!-- 3. DISCOVERY HUB -->
  <div id="view-hub" class="flex-1 bg-[#313338] flex flex-col overflow-y-auto">
    <div class="h-56 bg-gradient-to-r from-indigo-800 to-purple-800 p-8 flex flex-col justify-center items-center text-center shrink-0">
      <h1 class="text-3xl font-extrabold text-white">Temukan Komunitas di talk3r</h1>
      <p class="text-indigo-200 text-xs mt-1">Ngobrol seru, kirim stiker, dan kumpul bareng teman!</p>
      <div class="mt-4 flex gap-2">
        <button onclick="openModal('modal-server')" class="px-5 py-2.5 bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white text-xs font-bold rounded-lg shadow-lg cursor-pointer transition">
          ➕ Buat Grup Baru
        </button>
        <button onclick="openModal('modal-join')" class="px-5 py-2.5 bg-white/10 hover:bg-white/20 active:scale-95 text-white text-xs font-bold rounded-lg shadow-lg cursor-pointer transition">
          🔑 Gabung Pakai Kode
        </button>
      </div>
    </div>
    <div class="p-6 max-w-5xl mx-auto w-full">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-white font-bold text-sm">Grup Publik yang Tersedia</h2>
        <button onclick="openModal('modal-server')" class="px-3 py-1.5 bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white text-xs font-semibold rounded-md shadow cursor-pointer">
          + Buat Grup Baru
        </button>
      </div>
      <div id="hub-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
  </div>

  <!-- 4. CHAT VIEWPORT -->
  <div id="view-chat" class="flex-1 flex flex-col bg-[#313338] min-w-0 hidden relative">
    <header class="h-12 bg-[#313338] border-b border-[#232428] flex items-center justify-between px-4 text-white font-semibold shadow-sm shrink-0">
      <div class="flex items-center">
        <span class="text-gray-400 mr-2">#</span>
        <span id="channel-title">general</span>
      </div>
      <span id="connection-badge" class="text-[11px] px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300">Mode Lokal</span>
    </header>
    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 select-text"></div>

    <!-- Stiker Drawer -->
    <div id="drawer-stickers" class="hidden absolute bottom-20 right-4 w-72 bg-[#2b2d31] rounded-xl shadow-2xl border border-[#1f2023] p-3 z-50">
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-xs font-bold text-gray-300">Pilih Stiker</span>
        <button onclick="toggleStickers()" class="text-gray-400 hover:text-white cursor-pointer">✕</button>
      </div>
      <div id="sticker-list" class="grid grid-cols-4 gap-2 max-h-56 overflow-y-auto"></div>
    </div>

    <!-- Input Form -->
    <form onsubmit="handleSend(event)" class="p-4 bg-[#383a40] shrink-0">
      <div class="flex items-center bg-[#40444b] rounded-lg px-4 py-2 space-x-2">
        <input id="input-chat" type="text" placeholder="Tulis pesan..." class="flex-1 bg-transparent border-none outline-none text-sm text-white placeholder-gray-400" autocomplete="off">
        <button type="button" onclick="toggleStickers()" class="text-gray-400 hover:text-white active:scale-90 text-lg cursor-pointer">😊</button>
        <button type="submit" class="text-indigo-400 hover:text-indigo-300 active:scale-90 font-bold text-sm cursor-pointer">➤</button>
      </div>
    </form>
  </div>

  <!-- ================= MODALS ================= -->
  <!-- Modal Buat Server -->
  <div id="modal-server" style="display: none;" class="fixed inset-0 bg-black/60 items-center justify-center z-50 p-4">
    <form onsubmit="createGroup(event)" class="bg-[#313338] text-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
      <h2 class="text-lg font-bold">Buat Grup Baru</h2>
      <input id="new-server-name" type="text" required placeholder="Nama Grup..." class="w-full bg-[#1e1f22] p-2.5 rounded text-sm text-white outline-none">
      <label class="flex items-center space-x-2 text-xs cursor-pointer">
        <input id="new-server-priv" type="checkbox" class="w-4 h-4 accent-indigo-500">
        <span>Grup Privat (Pakai Kode Undangan)?</span>
      </label>
      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" onclick="closeModal('modal-server')" class="px-4 py-2 text-xs text-gray-300 hover:text-white cursor-pointer">Batal</button>
        <button type="submit" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 rounded-lg text-xs font-bold cursor-pointer">Buat</button>
      </div>
    </form>
  </div>

  <!-- Modal Gabung Kode -->
  <div id="modal-join" style="display: none;" class="fixed inset-0 bg-black/60 items-center justify-center z-50 p-4">
    <form onsubmit="joinByCode(event)" class="bg-[#313338] text-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
      <h2 class="text-lg font-bold">Gabung Grup dengan Kode</h2>
      <input id="join-code-input" type="text" required placeholder="Masukkan kode undangan (cth: TALK3R)..." class="w-full bg-[#1e1f22] p-2.5 rounded text-sm text-white uppercase outline-none">
      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" onclick="closeModal('modal-join')" class="px-4 py-2 text-xs text-gray-300 hover:text-white cursor-pointer">Batal</button>
        <button type="submit" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 rounded-lg text-xs font-bold cursor-pointer">Gabung</button>
      </div>
    </form>
  </div>

  <!-- Modal Tambah Channel -->
  <div id="modal-channel" style="display: none;" class="fixed inset-0 bg-black/60 items-center justify-center z-50 p-4">
