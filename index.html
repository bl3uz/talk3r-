<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>talk3r</title>
  
  <!-- Tailwind CSS & Supabase via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #2b2d31; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #111214; }
  </style>
</head>
<body class="bg-[#1e1f22] text-gray-200 h-screen w-screen overflow-hidden flex font-sans select-none">

  <!-- ================= 1. SERVER RAIL (Kiri) ================= -->
  <div class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 shrink-0 z-20">
    <!-- Tombol Hub / Compass -->
    <div class="relative group flex items-center justify-center w-full">
      <div id="hub-pill" class="absolute left-0 w-1 bg-white rounded-r-full h-10 transition-all duration-200"></div>
      <button onclick="switchView('hub')" title="Discovery Hub" class="w-12 h-12 bg-green-500 text-white rounded-2xl hover:rounded-2xl transition-all duration-200 active:scale-90 flex items-center justify-center shadow-lg">
        <!-- SVG Compass -->
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      </button>
    </div>

    <div class="w-8 h-[2px] bg-[#35363c] rounded"></div>

    <!-- Server List Container -->
    <div id="server-rail-list" class="flex flex-col space-y-2 items-center w-full overflow-y-auto max-h-[calc(100vh-220px)]"></div>

    <!-- Buat Server Baru (+) -->
    <button onclick="openModal('modal-create-server')" title="Buat Grup Baru" class="w-12 h-12 bg-[#313338] text-green-500 hover:bg-green-500 hover:text-white rounded-3xl hover:rounded-2xl transition-all duration-200 active:scale-90 flex items-center justify-center">
      <!-- SVG Plus -->
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>

    <!-- Gabung Server dengan Kode (🔑) -->
    <button onclick="openModal('modal-join-server')" title="Gabung dengan Kode" class="w-12 h-12 bg-[#313338] text-indigo-400 hover:bg-indigo-500 hover:text-white rounded-3xl hover:rounded-2xl transition-all duration-200 active:scale-90 flex items-center justify-center">
      <!-- SVG Key -->
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
    </button>
  </div>

  <!-- ================= 2. CHANNEL SIDEBAR ================= -->
  <div id="channel-sidebar" class="w-60 bg-[#2b2d31] flex flex-col border-r border-[#1f2023] shrink-0 hidden">
    <!-- Header Server -->
    <div class="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 font-bold text-white shadow-sm">
      <span id="active-server-name" class="truncate text-sm">Grup</span>
      <button onclick="openInviteModal()" title="Undang Teman" class="text-gray-400 hover:text-white p-1 rounded hover:bg-[#35373c] active:scale-90 transition">
        <!-- SVG UserPlus -->
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
      </button>
    </div>

    <!-- Daftar Channel Text -->
    <div class="flex-1 p-2 space-y-1 overflow-y-auto">
      <div class="flex items-center justify-between px-2 pt-2 pb-1">
        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">TEXT CHANNELS</span>
        <button onclick="openModal('modal-create-channel')" title="Buat Channel" class="text-gray-400 hover:text-white p-0.5 rounded active:scale-90">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
      <div id="channel-list" class="space-y-0.5"></div>
    </div>

    <!-- Tombol Keluar Server -->
    <div class="px-2 pb-1">
      <button onclick="leaveCurrentServer()" class="w-full py-1 text-[11px] text-red-400 hover:bg-red-500/10 rounded font-semibold text-center transition active:scale-95">
        Keluar dari Grup
      </button>
    </div>

    <!-- User Profile Footer -->
    <div class="h-16 bg-[#232428]
